<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>線上畫圖設計｜富林組合屋</title>
<meta name="description" content="富林組合屋線上平面圖：拖拉組合屋、門窗、衛浴、家具，畫完自動帶入報價單。">
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#156a74;--deep:#071a1d;--deep2:#0c2a2f;--neo:#c8f031;--ink:#1d2224;--mute:#5a6468;--bg:#eef1ee;--line:#dfe3e0;--red:#b3261e;--mono:'Space Grotesk','Noto Sans TC',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(100deg,var(--deep),var(--deep2) 60%,var(--teal));color:#fff;border-bottom:2px solid var(--neo)}
.top a.back{color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px;font-weight:900;min-height:44px}
.top img{width:34px;height:34px;border-radius:8px}
.top .ttl{line-height:1.25}
.top .ttl b{display:block;color:var(--neo);letter-spacing:2px}
.top .ttl span{font-size:12px;opacity:.8}
.top .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tb{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:0 12px;min-height:40px;font-size:14px;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.18)}
.tb.go{background:var(--neo);color:var(--deep);border-color:var(--neo);font-weight:900;box-shadow:0 0 16px rgba(200,240,49,.35)}
.main{display:grid;grid-template-columns:250px 1fr 290px;min-height:0}
/* palette */
.pal{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px 10px 30px}
.pal h3{font-size:13px;letter-spacing:2px;color:var(--teal);margin:14px 4px 8px;font-family:var(--mono);display:flex;align-items:center;gap:6px}
.pal h3::before{content:"//";background:var(--deep);color:var(--neo);padding:0 5px;border-radius:4px;font-size:11px}
.pal .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pi{border:1px solid var(--line);background:#fafbf9;border-radius:10px;padding:8px 6px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.pi:hover{border-color:var(--teal);box-shadow:0 0 0 1px rgba(200,240,49,.4),0 0 14px rgba(200,240,49,.25)}
.pi svg{width:100%;height:42px}
.pi b{font-size:13px;line-height:1.25}
.pi small{font-size:11px;color:var(--mute);font-family:var(--mono)}
.tpl{width:100%;border:1px dashed var(--teal);background:#eef6f6;border-radius:10px;padding:10px;font-size:14px;font-weight:700;color:var(--teal);margin-top:6px}
/* canvas */
.stage{position:relative;min-width:0;min-height:0;background:#f7f8f6;overflow:hidden;touch-action:none}
#svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#svg.pan{cursor:grabbing}
.hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;color:var(--mute);pointer-events:none;font-size:15px;line-height:1.8}
.hint b{display:block;font-size:22px;color:var(--ink)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.status{position:absolute;left:12px;bottom:12px;background:rgba(7,26,29,.88);color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-family:var(--mono);border:1px solid rgba(200,240,49,.3)}
.status b{color:var(--neo)}
/* props */
.side{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.props{padding:14px;border-bottom:1px solid var(--line)}
.props h2{font-size:18px;margin:0 0 2px}
.props .dim{font-family:var(--mono);color:var(--mute);font-size:13px;margin-bottom:10px}
.props .lb{font-size:13px;font-weight:700;margin:10px 0 6px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;min-height:40px;font-size:13px;line-height:1.25;text-align:left}
.pill small{display:block;font-size:11px;color:var(--mute);font-family:var(--mono)}
.pill[aria-pressed=true]{border-color:var(--teal);background:#eef6f6}
.pill:disabled{opacity:.35;cursor:not-allowed}
.btnrow{display:flex;gap:6px;margin-top:12px}
.btnrow button{flex:1;min-height:42px;border-radius:10px;border:1px solid var(--line);background:#fafbf9;font-size:14px}
.btnrow .del{color:var(--red)}
.empty{color:var(--mute);font-size:14px;line-height:1.7}
.quote{flex:1;overflow-y:auto;padding:12px 14px}
.quote h3{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between}
.ql{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ql span{color:var(--mute)}
.ql b{font-family:var(--mono);white-space:nowrap}
.qf{font-size:12px;color:var(--mute);margin-top:8px}
.qtot{padding:12px 14px;border-top:1px solid var(--line);background:#fafbf9}
.qtot .t{display:flex;justify-content:space-between;align-items:baseline}
.qtot .t b{font-family:var(--mono);font-size:24px;white-space:nowrap}
.qtot .t small{display:block;font-size:11px;color:var(--mute)}
.qtot button{width:100%;margin-top:8px;min-height:50px;border:0;border-radius:12px;background:var(--deep);color:var(--neo);font-size:16px;font-weight:900;box-shadow:0 0 16px rgba(200,240,49,.25)}
.mobq{display:none!important}
.mtools{display:none}
.wallbtn{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(200,240,49,.4);background:var(--deep);color:#fff;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:10}
.roofbtn{left:150px}
.wallbtn.on,.wallpi.on{background:var(--neo);color:var(--deep);border-color:var(--neo);box-shadow:0 0 18px rgba(200,240,49,.6)}
.wallpi{gap:8px}
#svg.drawing{cursor:crosshair}
.tright{position:absolute;right:12px;top:12px;display:flex;gap:8px;z-index:10;flex-wrap:wrap;justify-content:flex-end}
.fsw{display:flex;background:var(--deep);border:1px solid rgba(200,240,49,.4);border-radius:12px;padding:3px;gap:3px}
.fsw button{border:0;background:transparent;color:#fff;min-width:46px;min-height:38px;border-radius:9px;font-family:var(--mono);font-weight:700;font-size:15px}
.fsw button[aria-pressed=true]{background:var(--neo);color:var(--deep)}
.tbtn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(200,240,49,.4);background:var(--deep);color:#fff;font-size:15px;font-weight:700}
.tbtn i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:block}
.tbtn.go3d{background:var(--neo);color:var(--deep);border-color:var(--neo);box-shadow:0 0 16px rgba(200,240,49,.4)}
.cpop{position:absolute;right:12px;top:64px;z-index:15;background:#fff;border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;width:min(360px,calc(100% - 24px))}
.cpt{font-weight:700;margin-bottom:8px}
.cpg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cpg button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:0;overflow:hidden;text-align:left}
.cpg button[aria-pressed=true]{border-color:var(--teal);box-shadow:0 0 0 2px rgba(200,240,49,.6)}
.cpg img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.cpg span{display:block;font-size:12px;font-weight:700;padding:4px 6px}
.v3{position:fixed;inset:0;z-index:100;background:#0b1416;display:flex;flex-direction:column}
.v3[hidden]{display:none}
.v3h{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));color:#fff;border-bottom:1px solid rgba(200,240,49,.3)}
.v3h b{color:var(--neo);font-size:18px;letter-spacing:2px}
.v3h span{font-size:13px;opacity:.8}
.v3h button{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:22px}
.v3c{flex:1;position:relative;min-height:0;touch-action:none}
.v3c canvas{display:block;width:100%;height:100%}
.v3load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff}
.v3f{color:rgba(255,255,255,.7);font-size:12px;text-align:center;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep);color:#fff;border:1px solid rgba(200,240,49,.4);border-radius:30px;padding:10px 18px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
/* svg item styles */
.it{cursor:move}
.sel .hl{stroke:var(--neo);stroke-width:6;fill:none;filter:drop-shadow(0 0 6px rgba(200,240,49,.9))}
@media (max-width:860px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .stage{grid-row:1}
  .pal{grid-row:2;border-right:0;border-top:1px solid var(--line);max-height:34dvh;padding:6px 8px 10px}
  .pal .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pi{min-height:70px}
  .pi svg{height:30px}
  .pi b{font-size:12px}
  .side{position:absolute;top:58px;right:8px;left:8px;max-height:46dvh;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:30;display:none}
  .side.on{display:flex}
  .top .ttl span{display:none}
  .tb{min-height:38px;padding:0 9px;font-size:13px}
  .mobq{display:inline-flex!important}
  .top{gap:8px;padding:6px 8px}
  .top a.back{font-size:0;gap:0}
  .top .ttl b{font-size:14px;letter-spacing:1px;white-space:nowrap}
  .mobq{font-size:12px}
  .wallbtn{top:auto;bottom:44px;left:8px;min-height:40px;font-size:14px}
  .roofbtn{left:132px}
  .tright{right:8px;top:8px;gap:6px}
  .tbtn{min-height:40px;padding:0 10px;font-size:14px}
  .tbtn span{display:none}
  .fsw button{min-width:40px;min-height:34px}
  .cpop{top:56px;right:8px}
  .top .acts{gap:5px}
  #bClear,#bPng{display:none}
  .mtools{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:none;gap:6px;background:rgba(7,26,29,.92);padding:6px;border-radius:14px;border:1px solid rgba(200,240,49,.35);z-index:20}
  .mtools.on{display:flex}
  .mtools button{white-space:nowrap;min-height:40px;padding:0 12px;border-radius:10px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:14px}
  .mtools .del{color:#ff8a80}
  .status{font-size:11px;padding:4px 8px;right:64px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="./"><img src="img/logo.jpg" alt="">富林組合屋</a>
    <div class="ttl"><b>線上畫圖設計</b><span>拖拉擺放・畫完一鍵帶入報價單</span></div>
    <div class="acts">
      <button class="tb mobq" id="mobQ" type="button">清單</button>
      <button class="tb" id="bPng" type="button">下載圖片</button>
      <button class="tb" id="bClear" type="button">清空</button>
      <a class="tb" href="order.html" style="display:inline-flex;align-items:center;text-decoration:none">報價單</a>
      <button class="tb go" id="bGo" type="button">帶入報價單 →</button>
    </div>
  </header>
  <div class="main">
    <aside class="pal" id="pal" aria-label="元件"></aside>
    <div class="stage" id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="平面圖畫布">
        <defs>
          <pattern id="g10" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#e3e7e3" stroke-width="0.6"/></pattern>
          <pattern id="g100" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#g10)"/><path d="M100 0H0V100" fill="none" stroke="#c9d3cf" stroke-width="1.4"/></pattern>
          <pattern id="plank" width="100" height="20" patternUnits="userSpaceOnUse"><rect width="100" height="20" fill="#c79f6e"/><path d="M0 19.5H100" stroke="#a37a4c" stroke-width="1.2"/></pattern>
        </defs>
        <g id="world"><rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#g100)" id="bg"/><g id="items"></g></g>
      </svg>
      <div class="hint" id="hint"><b>從左側點選「組合屋」開始</b>拖曳移動・<b style="display:inline;font-size:15px">雙擊旋轉</b>・Delete 刪除<br>門窗拖到牆邊會自動貼牆・「畫隔間牆」拉線畫牆</div>
      <div class="tright"><div class="fsw" id="floorSw" role="group" aria-label="樓層"><button type="button" data-f="1" aria-pressed="true">1F</button><button type="button" data-f="2" aria-pressed="false">2F</button></div><button type="button" class="tbtn" id="colorBtn"><i></i><span>配色</span></button><button type="button" class="tbtn go3d" id="b3d"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>3D</button></div>
      <div class="cpop" id="cpop" hidden><div class="cpt">選擇配色（6 款）</div><div class="cpg" id="cpg"></div></div>
      <button type="button" class="wallbtn roofbtn" id="roofBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M2 12 12 4l10 8"/><path d="M5 10v9h14v-9"/></svg>屋頂</button>
      <button type="button" class="wallbtn" id="wallBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V4h16"/><path d="M4 12h9"/></svg>畫隔間牆</button>
      <div class="status" id="status"></div>
      <div class="mtools" id="mtools"><button type="button" data-a="rot">旋轉</button><button type="button" data-a="dup">複製</button><button type="button" data-a="props">款式</button><button type="button" class="del" data-a="del">刪除</button></div>
      <div class="zoom"><button type="button" id="zIn" aria-label="放大">＋</button><button type="button" id="zOut" aria-label="縮小">－</button><button type="button" id="zFit" aria-label="全部顯示" style="font-size:13px">全部</button></div>
    </div>
    <aside class="side" id="side">
      <div class="props" id="props"></div>
      <div class="quote" id="quote"></div>
      <div class="qtot"><div class="t"><span>預估總額<small>含兩成細節預留</small></span><b id="qTot">NT$ 0</b></div><button type="button" id="bGo2">帶入報價單 →</button></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="v3" id="v3" hidden><div class="v3h"><b>3D 示意</b><span id="v3c"></span><button type="button" id="v3dl" style="margin-left:auto;width:auto;padding:0 12px;font-size:14px">下載 3D 圖</button><button type="button" id="v3x" aria-label="關閉" style="margin-left:0">×</button></div><div class="v3c" id="v3wrap"><div class="v3load" id="v3load">3D 載入中…</div></div><div class="v3f">拖曳旋轉・滾輪／雙指縮放・右鍵／雙指拖曳平移　|　示意圖，實際以施工為準</div></div>

<script>
/* ========= 元件目錄（尺寸單位：公分；價格同報價單） ========= */
var MH={'3×6m':{'標準':98000,'平面天花':118000,'水泥板':120000,'PU板':198000},'3×8m':{'標準':138000,'平面天花':158000},'4×6m':{'標準':118000,'平面天花':138000,'水泥板':150000,'PU板':208000},'4×8m':{'標準':156000,'平面天花':176000,'水泥板':180000,'PU板':260000}};
var STYLES=['標準','平面天花','水泥板','PU板'];

 {sec:'組合屋主體',items:[
  {k:'mod',size:'3×6m',w:600,h:300,name:'組合屋 3×6'},{k:'mod',size:'3×8m',w:800,h:300,name:'組合屋 3×8'},

 {sec:'衛浴',items:[
  {k:'bath',id:'bjp',name:'日式衛浴',w:148,h:208,price:70000},

  {k:'bath',id:'btile',name:'磁磚衛浴',w:150,h:240,vars:[['浴簾',75000],['拉門',85000]]}]},
 {sec:'水電照明',items:[
  {k:'elec',id:'lamp',name:'吸頂燈',w:40,h:40,sym:'lamp',vars:[['圓形白光',3500],['圓形自然光',3500],['崁燈',3500]]},
  {k:'elec',id:'led',name:'LED 燈管',w:120,h:14,sym:'led',vars:[['單管 40W',2500],['雙管',3500]]},
  {k:'elec',id:'track',name:'軌道燈',w:100,h:14,sym:'track',price:4500},
  {k:'elec',id:'wclamp',name:'廁所燈',w:30,h:30,sym:'lamp',price:2500},
  {k:'elec',id:'olamp',name:'戶外筒燈',w:30,h:30,sym:'olamp',price:2800},
  {k:'elec',id:'sock',name:'插座 110v',w:30,h:18,sym:'sock',vars:[['110v',1500],['220v',2800]],v:'110v'},
  {k:'elec',id:'sock',name:'插座 220v',w:30,h:18,sym:'sock',vars:[['110v',1500],['220v',2800]],v:'220v'},

/* ========= 門窗貼牆 ========= */

    if(m.rot%180===0){if(it.cx>=b.x0-10&&it.cx<=b.x1+10&&m.w>=it.w){var d=Math.abs(it.cy-m.cy);if(d<bd){bd=d;best={m:m,side:'wh',b:b}}}}
    else{if(it.cy>=b.y0-10&&it.cy<=b.y1+10&&m.w>=it.w){var d2=Math.abs(it.cx-m.cx);if(d2<bd){bd=d2;best={m:m,side:'wv',b:b}}}}
  });
  S.items.forEach(function(m){if(m.k!=='mod'||m.floor!==it.floor)return;var b=box(m);
    [['t',b.y0],['b',b.y1]].forEach(function(s){if(it.cx>=b.x0-20&&it.cx<=b.x1+20){var d=Math.abs(it.cy-s[1]);if(d<bd&&b.x1-b.x0>=it.w){bd=d;best={m:m,side:s[0],b:b}}}});

  if(best.side==='wv'){it.cx=best.m.cx;it.cy=Math.min(Math.max(snap(it.cy,5),b.y0+hw),b.y1-hw);if(!(it.rot%180))it.rot=90;it.att={m:best.m.uid,side:'wv',off:it.cy-b.y0};return}
  if(best.side==='t'||best.side==='b'){it.cy=best.side==='t'?b.y0:b.y1;it.cx=Math.min(Math.max(snap(it.cx,5),b.x0+hw),b.x1-hw);it.rot=best.side==='t'?0:180;it.att={m:best.m.uid,side:best.side,off:it.cx-b.x0}}

/* ========= 屋頂 ========= */
function roofCalc(){var ms=S.items.filter(function(i){return i.k==='mod'});if(!ms.length)return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ms.forEach(function(m){var b=box(m);x0=Math.min(x0,b.x0);y0=Math.min(y0,b.y0);x1=Math.max(x1,b.x1);y1=Math.max(y1,b.y1)});
  var L=(x1-x0)/100+1,W=(y1-y0)/100+1,a=L*W;return {x0:x0-50,y0:y0-50,x1:x1+50,y1:y1+50,L:L,W:W,m2:a,ping:a/3.3058,q:Math.ceil(a/3.3058)}}

  if(!S.roof){S.roof={i:0};selId=-1;toast('已加屋頂：最長、最寬各加 1 m 估算坪數')}else{selId=-1}render();document.getElementById('side').classList.add('on')}

/* ========= 隔間牆 ========= */
function snapPt(p){var x=snap(p.x,10),y=snap(p.y,10),th=25,bx=null,by=null;
  S.items.forEach(function(o){if((o.k!=='mod'&&o.k!=='wall')||o.floor!==S.floor)return;var b=box(o);
    var xs=o.k==='mod'?[b.x0+5,b.x1-5]:[o.rot%180?o.cx:b.x0,o.rot%180?o.cx:b.x1],ys=o.k==='mod'?[b.y0+5,b.y1-5]:[o.rot%180?b.y0:o.cy,o.rot%180?b.y1:o.cy];
    xs.forEach(function(v){var d=Math.abs(v-p.x);if(d<th&&(bx===null||d<Math.abs(bx-p.x)))bx=v});
    ys.forEach(function(v){var d=Math.abs(v-p.y);if(d<th&&(by===null||d<Math.abs(by-p.y)))by=v});});

  if(it.colors)h+='<div class="lb">顏色</div><div class="pills">'+it.colors.map(function(c){return '<button type="button" class="pill" data-a="color" data-v="'+c+'" aria-pressed="'+(it.color===c)+'">'+c+'</button>'}).join('')+'</div>';
  var p=priceOf(it);h+='<div class="lb">'+(it.k==='furn'?'家具為擺設參考，不計價':it.k==='wall'?'隔間 NT$ 3,000 / 米（依總長度計）':'單價 '+fmt(p))+'</div>';
  h+='<div class="btnrow"><button type="button" data-a="rot">旋轉（雙擊）</button><button type="button" data-a="dup">複製</button><button type="button" class="del" data-a="del">刪除</button></div>';
  props.innerHTML=h;
}
props.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.a==='roof'){S.roof.i=+b.dataset.v;render();return}if(b.dataset.a==='roofdel'){S.roof=null;selId=null;render();return}
  var it=byId(selId);if(!it)return;var a=b.dataset.a;
  if(a==='size'){var oc=box(it);it.size=b.dataset.v;var d=LIB[0].items.filter(function(x){return x.size===it.size})[0];it.w=d.w;it.h=d.h;it.name=d.name;if(!MH[it.size][it.style])it.style='標準';it.cx=oc.x0+bw(it)/2;it.cy=oc.y0+bh(it)/2;reattachAll(it)}
  else if(a==='wl'){it.w=Math.max(30,it.w+ +b.dataset.v);reattachAll(it)}
  else if(a==='style')it.style=b.dataset.v;
  else if(a==='v')it.v=b.dataset.v;
  else if(a==='dsize'){var D=DECKV[it.id][b.dataset.v];it.v=b.dataset.v;it.w=D[0];it.h=D[1];it.price=D[2];it.name=(it.id==='fdeck'?'框架露台 ':'露台 ')+it.v.replace('m','')}
  else if(a==='color')it.color=b.dataset.v;
  else if(a==='rot')rotate(it);
  else if(a==='dup')dup(it);
  else if(a==='del'){del(it);return}
  render();});
function reattachAll(m){S.items.forEach(function(o){if(o.att&&o.att.m===m.uid){o.att=null;attach(o,false)}})}
function rotate(it){if(it.k==='win'||it.k==='door'){if(it.att&&(it.att.side==='wh'||it.att.side==='wv'))it.rot=(it.rot+180)%360;else if(it.att)it.rot=(it.rot+180)%360;else it.rot=(it.rot+90)%360;return}it.rot=(it.rot+90)%360;if(it.k==='mod'){snapMod(it);reattachAll(it)}if(it.k==='wall')reattachAll(it)}
function dup(it){var c=JSON.parse(JSON.stringify(it));c.uid=S.seq++;c.cx+=(it.k==='mod'?bw(it):60);c.att=null;S.items.push(c);if(c.k==='win'||c.k==='door')attach(c,false);if(c.k==='mod')snapMod(c);selId=c.uid}
function del(it){S.items=S.items.filter(function(o){return o!==it&&!(o.att&&o.att.m===it.uid&&(it.k==='mod'||it.k==='wall'))});selId=null;render()}
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='w'||e.key==='W'){setWallMode(!wallMode);return}if(e.key==='Escape'&&wallMode){setWallMode(false);return}var it=byId(selId);if(!it)return;
  if(e.key==='r'||e.key==='R'){rotate(it);render()}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del(it)}
  else if(e.key.indexOf('Arrow')===0){e.preventDefault();var s=e.shiftKey?50:10;if(e.key==='ArrowLeft')it.cx-=s;if(e.key==='ArrowRight')it.cx+=s;if(e.key==='ArrowUp')it.cy-=s;if(e.key==='ArrowDown')it.cy+=s;if(it.k==='mod')moveAttached(it);if(it.k==='win'||it.k==='door'){it.att=null;attach(it,false)}render()}
  else if(e.key==='Escape'){selId=null;render()}
  else if((e.metaKey||e.ctrlKey)&&e.key==='d'){e.preventDefault();dup(it);render()}});

/* ========= 計價 ========= */
function priceOf(it){if(it.k==='wall')return 3000*it.w/100;if(it.k==='mod')return MH[it.size][it.style]||0;if(it.k==='furn')return 0;if(it.vars){var v=it.vars.filter(function(x){return x[0]===it.v})[0];return v?v[1]:0}return it.price||0}
function lineOf(it){
  if(it.k==='furn'||it.k==='wall')return null;
  if(it.k==='mod')return {id:'mh',o:{size:it.size,style:it.style},t:it.size+'・'+it.style};
  if(it.k==='deck')return {id:it.id,o:{v:it.v},t:it.v};
  var o={},t=[];
  if(it.v){o.v=it.v;t.push(it.v)}
  if(it.color){o.c=it.color;t.push(it.color)}
  return {id:it.id,o:o,t:t.join('・')};
}
function quoteLines(){var map={},list=[];S.items.forEach(function(it){var l=lineOf(it);if(!l)return;var k=l.id+'|'+l.t;if(!map[k]){map[k]={k:k,id:l.id,o:l.o,t:l.t,u:priceOf(it),q:0};list.push(map[k])}map[k].q++});
  var wl=S.items.filter(function(i){return i.k==='wall'}).reduce(function(s,i){return s+i.w},0);
  var n2=S.items.filter(function(i){return i.k==='mod'&&i.floor===2}).length;if(n2)list.push({k:'f2|',id:'f2',o:{},t:'二樓組合屋 '+n2+' 顆',u:20000,q:n2});
  var rc=S.roof&&roofCalc();if(rc){var R0=ROOFS[S.roof.i];list.push({k:R0[0]+'|'+R0[2],id:R0[0],o:R0[2]?{v:R0[2]}:{},t:(R0[2]?R0[2]+'・':'')+rc.L.toFixed(1)+'×'+rc.W.toFixed(1)+'m ≈ '+rc.ping.toFixed(1)+' 坪',u:R0[3],q:rc.q})}
  if(wl>0)list.push({k:'part|',id:'part',o:{},t:'總長 '+(wl/100).toFixed(1)+' m，以 '+Math.ceil(wl/100)+' 米計',u:3000,q:Math.ceil(wl/100)});
  return list}
function renderQuote(){
  var L=quoteLines(),tot=L.reduce(function(s,l){return s+l.u*l.q},0),furn=S.items.filter(function(i){return i.k==='furn'});
  var h='<h3><span>圖面清單</span><span style="color:var(--mute);font-weight:400">'+L.length+' 項</span></h3>';
  if(!L.length)h+='<p class="empty">畫面上還沒有可計價的元件。</p>';
  L.forEach(function(l){h+='<div class="ql"><div>'+esc(NAMES[l.id])+(l.t?'<br><span>'+esc(l.t)+'</span>':'')+'</div><b>'+l.q+UNITS[l.id]+'　'+fmt(l.u*l.q)+'</b></div>'});
  if(furn.length)h+='<p class="qf">家具 '+furn.length+' 件為擺設參考，不列入報價。</p>';
  h+='<p class="qf">配色：<b>'+COLORS[S.color][0]+'</b>（配色不影響價格，帶入報價單時會寫進備註）</p>';
  h+='<p class="qf">組合屋標配基本門窗；施工、運費、水電等請到報價單加選。</p>';
  var rs=tot>0?Math.round(tot*0.2):0;if(L.length)h+='<div class="ql"><div>商品小計</div><b>'+fmt(tot)+'</b></div><div class="ql"><div>細節調整預留<br><span>小計兩成，現場確認後多退少補</span></div><b>+ '+fmt(rs)+'</b></div>';
  document.getElementById('quote').innerHTML=h;document.getElementById('qTot').textContent=fmt(tot+rs);
}
function toOrder(){
  var L=quoteLines();if(!L.length){toast('畫面上還沒有可計價的元件');return}
  var cart=[];try{cart=JSON.parse(localStorage.getItem('fulin_cart_v1')||'[]')||[]}catch(e){}
  cart=cart.filter(function(l){return !l.plan});
  L.forEach(function(l){cart.push({k:l.k,id:l.id,o:l.o,u:l.u,q:l.q,plan:1})});
  try{localStorage.setItem('fulin_cart_v1',JSON.stringify(cart))}catch(e){}
  try{var cu=JSON.parse(localStorage.getItem('fulin_cust_v1')||'{}')||{};var mm=(cu.memo||'').replace(/圖面配色：[^，\n]*[，]?/g,'').trim();cu.memo='圖面配色：'+COLORS[S.color][0]+(S.items.some(function(i){return i.floor===2})?'，含二樓':'')+(mm?'，'+mm:'');cu.name=cu.name||'';cu.phone=cu.phone||'';cu.place=cu.place||'';localStorage.setItem('fulin_cust_v1',JSON.stringify(cu))}catch(e){}
  location.href='order.html#fromplan';
}
document.getElementById('bGo').onclick=toOrder;document.getElementById('bGo2').onclick=toOrder;

/* ========= 範本 / 清空 / 下載 ========= */
function N(n){for(var a=0;a<LIB.length;a++)for(var b=0;b<LIB[a].items.length;b++)if(LIB[a].items[b].name===n)return LIB[a].items[b];return null}
function template(){
  if(S.items.length&&!confirm('套用範本會清除目前畫面，確定嗎？'))return;
  S.items=[];S.floor=1;var c={x:0,y:0};
  var m=add(N('組合屋 4×8'),{x:0,y:0});
  add(N('小衛浴'),{x:-400+55+10,y:-200+70+10});
  add(N('5尺雙人床'),{x:250,y:-200+94+20});
  add(N('6尺衣櫃'),{x:250,y:200-30-10});
  add(N('280cm 沙發'),{x:-60,y:200-45-30});
  var d=add(N('基本門'),{x:-100,y:200});
  add(N('氣密窗'),{x:150,y:200});add(N('氣密窗'),{x:150,y:-200});add(N('廁所小窗'),{x:-330,y:-200});
  add(N('露台 2×6'),{x:0,y:300});
  selId=null;render();fit();
}
document.getElementById('bClear').onclick=function(){if(!S.items.length)return;if(confirm('確定清空整張圖？')){S.items=[];S.roof=null;selId=null;render()}};
document.getElementById('bPng').onclick=function(){
  var b=bounds();if(!b){toast('畫面是空的');return}var pad=80,W=b.x1-b.x0+pad*2,H=b.y1-b.y0+pad*2,sc=Math.min(2400/W,2400/H,1.5);
  var sel=selId;selId=null;render();
  var inner=document.getElementById('items').innerHTML;selId=sel;render();
  var defs=svg.querySelector('defs').outerHTML;
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+Math.round(W*sc)+'" height="'+Math.round(H*sc)+'" viewBox="'+(b.x0-pad)+' '+(b.y0-pad)+' '+W+' '+H+'">'+defs+'<rect x="'+(b.x0-pad)+'" y="'+(b.y0-pad)+'" width="'+W+'" height="'+H+'" fill="#fff"/><rect x="'+(b.x0-pad)+'" y="'+(b.y0-pad)+'" width="'+W+'" height="'+H+'" fill="url(#g100)"/>'+inner+'<text x="'+(b.x0-pad+20)+'" y="'+(b.y1+pad-20)+'" font-size="24" fill="#156a74" font-family="sans-serif">富林組合屋 線上平面圖・格線每格 1m・示意圖，實際以現場丈量為準</text></svg>';
  var img=new Image();img.onload=function(){var cv=document.createElement('canvas');cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);var cx=cv.getContext('2d');cx.drawImage(img,0,0);
    cv.toBlob(function(bl){var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='富林組合屋平面圖.png';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)},'image/png')};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
};
var tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2200)}
document.getElementById('mtools').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var it=byId(selId);if(!it)return;var a=b.dataset.a;
  if(a==='props'){document.getElementById('side').classList.add('on');return}if(a==='rot')rotate(it);else if(a==='dup')dup(it);else if(a==='del'){del(it);return}render()});
document.getElementById('roofBtn').onclick=toggleRoof;
document.getElementById('floorSw').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.floor=+b.dataset.f;selId=null;render();
  if(S.floor===2)toast(S.items.some(function(i){return i.floor===2})?'切換到 2F':'切換到 2F：淡色是 1F 位置，點組合屋會自動疊在 1F 上方；記得加樓梯');else toast('切換到 1F')});
var cpg=document.getElementById('cpg'),cpop=document.getElementById('cpop');
function drawCp(){cpg.innerHTML=COLORS.map(function(c,i){return '<button type="button" data-i="'+i+'" aria-pressed="'+(S.color===i)+'"><img src="img/'+c[3]+'.jpg" alt=""><span>'+c[0]+'</span></button>'}).join('')}
document.getElementById('colorBtn').onclick=function(){drawCp();cpop.hidden=!cpop.hidden};
cpg.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.color=+b.dataset.i;drawCp();render();cpop.hidden=true;toast('配色：'+COLORS[S.color][0])});
document.getElementById('b3d').onclick=open3d;
document.getElementById('v3x').onclick=close3d;
document.getElementById('v3dl').onclick=function(){if(!V3)return;var u=V3.snapshot();if(!u)return;var a=document.createElement('a');a.href=u;a.download='富林組合屋3D示意.png';document.body.appendChild(a);a.click();a.remove()};
var V3=null;
function open3d(){if(!S.items.some(function(i){return i.k==='mod'})){toast('請先放組合屋');return}
  document.getElementById('v3').hidden=false;document.getElementById('v3c').textContent=COLORS[S.color][0]+(S.items.some(function(i){return i.floor===2})?'・兩層':'');
  import('./js/plan3d.js').then(function(m){V3=m;document.getElementById('v3load').style.display='none';m.show(document.getElementById('v3wrap'),S,{COLORS:COLORS,roofCalc:roofCalc,box:box})}).catch(function(err){document.getElementById('v3load').textContent='3D 無法載入，請改用較新的瀏覽器';console.error(err)})}
function close3d(){document.getElementById('v3').hidden=true;if(V3)V3.hide()}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('v3').hidden)close3d()});
document.getElementById('wallBtn').onclick=function(){setWallMode(!wallMode)};
document.getElementById('mobQ').onclick=function(){document.getElementById('side').classList.toggle('on')};

/* ========= 啟動 ========= */
window.addEventListener('resize',applyView);
render();
setTimeout(function(){if(S.items.length)fit();else{var r=svg.getBoundingClientRect();view.tx=r.width/2;view.ty=r.height/2;applyView()}},30);
</script>
